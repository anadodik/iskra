[project]
name = "iskra-graphics"
version = "0.0.1"
description = "iskra: Tensor Geometry Processing"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ana Dodik", email = "anadodik@mit.edu" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "geometry-processing",
  "mesh",
  "pytorch",
  "differentiable",
  "graphics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Typing :: Typed",
]
dependencies = [
  "numpy",
  "scipy",
  "networkx",
  "cholespy",
  "rich",
  "typing-extensions",
  "trimesh",
  "meshio",
  "libigl",
  "fsspec[http]",
  "requests",
]

[project.urls]
Homepage = "https://iskra-graphics.org"
Documentation = "https://iskra-graphics.org"
Repository = "https://github.com/anadodik/iskra"
Issues = "https://github.com/anadodik/iskra/issues"

[build-system]
requires = [
  "scikit-build-core>=0.10.7",
  "nanobind[dev]>=2.5.0",
  "cmake>=4.3.1",
  "ninja>=1.13.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "0.4"
wheel.py-api = "cp312"
wheel.packages = ["iskra"]
build-dir = "build/{wheel_tag}"
cmake.verbose = true
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
CMAKE_CUDA_ARCHITECTURES = "89"

[tool.cibuildwheel]
# The extension is built against the stable ABI (wheel.py-api = "cp312"), so a
# single cp312 build covers every supported interpreter.
build = "cp312-*"
skip = "*-musllinux_*"
build-frontend = "build"
# Smoke test the compiled extension only. Importing iskra.io would pull in
# torch, which is deliberately not a dependency of the package.
test-command = "python {project}/scripts/smoke_test_wheel.py"
# cholespy publishes no aarch64 wheel, so installing the wheel to test it would
# try to compile cholespy against a BLAS/LAPACK the runner does not have. The
# aarch64 wheel is still built and shipped; it just goes untested here.
test-skip = "*_aarch64"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
# 32-bit Windows is not a supported target: scipy, cholespy and libigl all
# ship no win32 wheels, so such a wheel could never be installed.
archs = ["AMD64"]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

# rapidobj needs C++17 std::filesystem, which is 10.15+ on x86_64. arm64 keeps
# 11.0 above, since anything lower is not a valid deployment target there.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.black]
line-length = 88

include = '\.pyi?$'

exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"

[tool.ruff]
# Enable Pyflakes `E` and `F` codes by default.
select = ["E", "F", "D", "N", "I", "PTH", "RSE", "RUF"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "I"]
unfixable = ["F401", "F841", "F842"]

# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]
per-file-ignores = {}

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Avoid automatically removing unused imports in __init__.py 
ignore-init-module-imports = true

# Assume Python 3.11.
target-version = "py312"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-rA -s"
testpaths = ["tests/"]
python_classes = "Test* *Test"
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"

[tool.pyright]
include = ["iskra"]
exclude = ["**/__pycache__"]
reportMissingImports = "error"
typeCheckingMode = "basic"
venv = "iskra"
pythonVersion = "3.12"
