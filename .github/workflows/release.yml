name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Index to upload to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
  release:
    types: [published]

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux_2_28 x86_64
          - ubuntu-24.04-arm   # manylinux_2_28 aarch64
          - macos-15-intel     # x86_64
          - macos-14           # arm64
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to ${{ github.event.inputs.target || 'pypi' }}
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'pypi' }}
    permissions:
      id-token: write  # trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -l dist

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event.inputs.target != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
